name: Update StatCan prices

# Statistics Canada releases this table monthly; checking weekly picks up a
# new month within a few days of release. Also runnable from the Actions tab.
on:
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-prices.js
      - run: npm test
      - name: Commit if prices changed
        run: |
          if git diff --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update StatCan prices"
          git push
